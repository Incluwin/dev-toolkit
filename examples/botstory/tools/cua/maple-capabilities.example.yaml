# cua-driver capability manifest for MapleServer computer-use work.
# Deny-by-default ceiling: the driver may only observe/drive the BotStory
# client (launcher + MapleStory.exe) and write recordings under evidence/.
# Launch stays manual (PowerShell, __COMPAT_LAYER=RunAsInvoker) because the
# exes embed requireAdministrator; launch_app cannot set the compat layer.
version: 3

resources:
  apps:
    - executable: 'C:\Path\To\MapleServer\FriendServer\BotStory Client\Game Files\MapleStory.exe'
      launch: false
      windows: all
      terminate: deny
    - executable: 'C:\Path\To\MapleServer\FriendServer\BotStory Client\Game Files\Launch Game.exe'
      launch: false
      windows: all
      terminate: deny
  # Needed by list_windows / get_accessibility_tree to locate the client window.
  desktop:
    display: true
  files:
    write:
      - dir: 'C:\Path\To\MapleServer\FriendServer\BotStory Server\docs\agents\evidence'
        recursive: true

allow:
  tools:
    - start_session
    - end_session
    - get_session
    - list_sessions
    - health_report
    - check_permissions
    - get_config
    - list_apps
    - list_windows
    - debug_window_info
    - get_accessibility_tree
    - get_window_state
    # OCR + icon regions from a get_window_state capture_id (cua-perception
    # extension, installed separately under ~/.cua-driver/extensions).
    - parse_visual_regions
    - get_screen_size
    - get_cursor_position
    - zoom
    - verify_state
    - bring_to_front
    - set_window_frame
    - click
    - double_click
    - right_click
    - drag
    - scroll
    - press_key
    - hotkey
    - type_text
    - move_cursor
    - get_agent_cursor_state
    - set_agent_cursor_enabled
    - start_recording
    - stop_recording
    - get_recording_state
